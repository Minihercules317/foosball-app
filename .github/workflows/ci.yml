name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check

  unit:
    name: Unit, property, integration & regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Deterministic (fixed fast-check seed). Documented discrepancies pass here
      # only while they still reproduce as ASSERTION failures; a crash inside one,
      # or a discrepancy that stops reproducing, turns this job red with a distinct
      # "UNEXPECTED ERROR" / "NO LONGER REPRODUCES" message (test/harness/discrepancy.js).
      - run: npm test

  e2e:
    name: Browser tests (Playwright / Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  discrepancies:
    name: Known discrepancies (informational, needs owner review)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # STRICT=1: each discrepancy runs as a normal test and FAILS, printing its
      # reproduction for reviewers. Expected to be red; non-blocking by design.
      # The pass/fail signal for discrepancies lives in the "unit" job above.
      - run: npm run test:discrepancies
